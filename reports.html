  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <a class="brand" href="index.html">
          <img class="brand-logo" src="assets/logo.jpg" alt="Hadhramout Future Forum">
          <div class="logo-text">
            <h1>منتدى مستقبل حضرموت</h1>
            <p>Hadhramout Future Forum</p>
          </div>
        </a>
        <div class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></div>
        <nav>
          <ul>
            <li><a href="vision.html">الرؤية</a></li>
            <li><a href="goals.html">الأهداف</a></li>
            <li><a href="approach.html">آليات العمل</a></li>
            <li><a href="philosophy.html">فلسفة الشعار</a></li>
            <li><a href="contact.html">تواصل معنا</a></li>
            <li><a href="blog.html">المقالات</a></li>
            <li><a href="reports.html">التقارير</a></li>
          <li><a href="admin/dashboard.html" title="لوحة التحكم"><i class="fas fa-gear"></i></a></li></ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="section-title"><h2>التقارير</h2></div>
      <div id="reports-list" class="cards-container"></div>
      
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="copyright"><p>جميع الحقوق محفوظة &copy; 2025 منتدى مستقبل حضرموت</p></div>
    </div>
  </footer>
  <script src="js/script.js"></script>
  <script>
  (function () {
    const wrap = document.getElementById('reports-list');
    if (!wrap) return;

    function getLocalReports() {
      try {
        const arr = JSON.parse(localStorage.getItem('reports') || '[]');
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function buildCards(localItems, jsonItems) {
      const parts = [];

      // تقارير تم إنشاؤها من لوحة التحكم (مرفوعة إلى Cloudinary)
      if (Array.isArray(localItems) && localItems.length) {
        localItems.forEach(function (r, idx) {
          const title = r.title || ('تقرير #' + (idx + 1));
          const url = (r.url || '').toString();
          const password = (r.password || '').toString();
          if (!url) {
            return;
          }
          const isProtected = password.trim() !== '';

          parts.push(`
      <div class="card">
        <h3>${title}</h3>
        <p>هذا التقرير متاح للتنزيل عبر الرابط التالي.</p>
        <button class="btn report-download-btn" data-report-url="${url}" data-report-password="${password}">
          ${isProtected ? 'تنزيل (محمي)' : 'تنزيل'}
        </button>
      </div>`);
        });
      }

      // تقارير معرفة مسبقاً في content/reports/reports.json
      if (Array.isArray(jsonItems) && jsonItems.length) {
        jsonItems.forEach(function (it) {
          const isProtected = !!it.protected;
          const file = (it.file || '').toString();
          const password = (it.password || '').toString();

          parts.push(`
      <div class="card">
        <h3>${it.title || 'تقرير'}</h3>
        <p>${it.description || ''}</p>
        <button class="btn report-download-btn" data-report-url="${file}" data-report-password="${password}">
          ${isProtected ? 'تنزيل (محمي)' : 'تنزيل'}
        </button>
      </div>`);
        });
      }

      if (!parts.length) {
        wrap.innerHTML = '<p>لا توجد تقارير حالياً.</p>';
        return;
      }

      wrap.innerHTML = parts.join('');

      // Attach click handlers after rendering
      const buttons = wrap.querySelectorAll('.report-download-btn');
      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const url = this.getAttribute('data-report-url') || '';
          const pw = this.getAttribute('data-report-password') || '';
          promptDownload(url, pw);
        });
      });
    }

    const localReports = getLocalReports();

    fetch('content/reports/reports.json')
      .then(function (r) { return r.json(); })
      .then(function (items) {
        buildCards(localReports, items);
      })
      .catch(function () {
        buildCards(localReports, []);
      });

    window.promptDownload = function (file, pw) {
      if (!file) return;
      if (!pw) { window.location = file; return; }
      const input = window.prompt('أدخل كلمة المرور:');
      if (input === pw) {
        window.location = file;
      } else {
        alert('كلمة المرور غير صحيحة');
      }
    };
  })();
  </script>
</body>
</html>
