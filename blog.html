<script src="js/script.js"></script>
<script>
(function () {
  const wrap = document.getElementById('blog-list');
  if (!wrap) return;
  const API_URL = "https://script.google.com/macros/s/AKfycbzrrCg2VRAuXXCaFEoJXDa3CxfQBpWEa9IHjG4cakHGgmEgE2rsttKe-ryufD2YkdW/exec";

  function renderFromApi(items) {
    if (!items || !items.length) {
      wrap.innerHTML = '<p>لا توجد مقالات حالياً.</p>';
      return;
    }
    let html = "";
    items.forEach(function (it) {
      const title = it.title || "";
      const body = (it.main || "").replace(/\n/g, "<br>");
      html += '<article class="blog-card">'
           + '<h2>' + title + '</h2>'
           + '<p>' + body + '</p>'
           + '</article>';
    });
    wrap.innerHTML = html;
  }

  function renderFallback() {
    fetch('content/blog/posts.json')
      .then(function (r) { return r.json(); })
      .then(function (items) {
        if (!Array.isArray(items) || !items.length) {
          wrap.innerHTML = '<p>لا توجد مقالات حالياً.</p>';
          return;
        }
        let html = "";
        items.forEach(function (it) {
          const title = it.title || "";
          const body = (it.content || "").replace(/\n/g, "<br>");
          html += '<article class="blog-card">'
               + '<h2>' + title + '</h2>'
               + '<p>' + body + '</p>'
               + '</article>';
        });
        wrap.innerHTML = html;
      })
      .catch(function () {
        wrap.innerHTML = '<p>تعذر تحميل المقالات حالياً.</p>';
      });
  }

  fetch(API_URL + '?type=blog')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && Array.isArray(data.items) && data.items.length) {
        renderFromApi(data.items);
      } else {
        renderFallback();
      }
    })
    .catch(function () {
      renderFallback();
    });
})();
</script>

</body>
