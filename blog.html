<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المقالات - منتدى مستقبل حضرموت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <a class="brand" href="index.html">
          <img class="brand-logo" src="assets/logo.jpg" alt="Hadhramout Future Forum">
          <div class="logo-text">
            <h1>منتدى مستقبل حضرموت</h1>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="copyright"><p>جميع الحقوق محفوظة &copy; 2025 منتدى مستقبل حضرموت</p></div>
    </div>
  </footer>
  <script src="js/script.js"></script>
  <script>
  (function () {
    const wrap = document.getElementById('blog-list');
    if (!wrap) return;

    function getLocalBlogs() {
      try {
        const arr = JSON.parse(localStorage.getItem('blogs') || '[]');
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function buildCards(localItems, jsonItems) {
      const all = [];

      if (Array.isArray(localItems)) {
        localItems.forEach(function (b, idx) {
          const content = (b.content || '').toString();
          const short = content.length > 160 ? content.slice(0, 160) + '…' : content;
          all.push({
            title: b.title || ('مقال #' + (idx + 1)),
            excerpt: short,
            url: '#'
          });
        });
      }

      if (Array.isArray(jsonItems)) {
        jsonItems.forEach(function (p) {
          all.push({
            title: p.title || 'مقال',
            excerpt: p.excerpt || '',
            url: p.url || '#'
          });
        });
      }

      if (!all.length) {
        wrap.innerHTML = '<p>لا توجد مقالات حالياً.</p>';
        return;
      }

      wrap.innerHTML = all.map(function (p) {
        return `
      <article class="card">
        <h3 style="margin-bottom:8px;">${p.title}</h3>
        <p style="margin-bottom:10px;">${p.excerpt}</p>
        <a class="btn" href="${p.url}" target="_blank" rel="noopener">اقرأ المزيد</a>
      </article>`;
      }).join('');
    }

    const localBlogs = getLocalBlogs();

    fetch('content/blog/posts.json')
      .then(function (r) { return r.json(); })
      .then(function (items) {
        buildCards(localBlogs, items);
      })
      .catch(function () {
        buildCards(localBlogs, []);
      });
  })();
  </script>
</body>
</html>
