backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "المقالات"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "العنوان", name: "title", widget: "string"}
      - {label: "المحتوى", name: "body", widget: "markdown"}

  - name: "reports"
    label: "التقارير"
    folder: "content/reports"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "العنوان", name: "title", widget: "string"}
      - {label: "حمّل الملف", name: "file", widget: "file"}
      - {label: "كلمة مرور (اختياري)", name: "password", widget: "string", required: false}
